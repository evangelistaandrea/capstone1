<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Monitoring | PHINMA UPang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --school-green: #1b4332; 
            --paper-white: #ffffff; 
            --border-ink: #e2e8f0; 
            --text-sub: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { 
            background: #f2f4f7; 
            padding: 20px; 
            color: var(--school-green); 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        .header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: var(--paper-white); 
            padding: 15px 30px; 
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }

        .main-layout { 
            display: grid; 
            grid-template-columns: 320px 1fr; 
            gap: 20px; 
            flex-grow: 1;
            min-height: 0; 
        }

        .panel { 
            background: var(--paper-white); 
            border-radius: 20px; 
            padding: 25px; 
            border: 1px solid var(--border-ink); 
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            height: 100%;
        }
        
        .right-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100%;
        }

        .occupancy-hero {
            background: var(--school-green); 
            color: white; 
            padding: 40px; 
            border-radius: 20px;
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
        }

        .sensor-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            grid-template-rows: repeat(2, 1fr);
            gap: 20px; 
            flex-grow: 1; 
        }

        .sensor-card { 
            background: #fff; 
            border: 2px solid var(--border-ink); 
            border-radius: 18px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .s-val { 
            font-size: 3.5rem; 
            font-weight: 900; 
            color: var(--school-green); 
            line-height: 1;
        }

        .s-label {
            color: var(--text-sub);
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .schedule-item { 
            margin-bottom: 18px; 
            padding-bottom: 12px; 
            border-bottom: 1px dashed #cbd5e1; 
        }

        .label { 
            font-size: 0.7rem; 
            font-weight: 800; 
            color: #94a3b8; 
            text-transform: uppercase; 
        }

        .data { 
            font-size: 1.05rem; 
            font-weight: 800; 
            color: var(--school-green); 
            margin-top: 3px;
        }

        .exit-link {
            margin-top: auto;
            background: #be123c;
            color: white;
            padding: 18px;
            border-radius: 12px;
            font-weight: 900;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: block;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .exit-link:hover { 
            background: #9f1239; 
        }

        #clock { font-weight: 900; font-size: 1.8rem; line-height: 1; }
        #date-display { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); margin-top: 2px; }
    </style>
</head>
<body>

    <header class="header">
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo.png" height="55">
            <div>
                <h1 id="display-room" style="font-size: 1.6rem; font-weight: 900;">ROOM ---</h1>
                <p id="display-bldg" style="font-size: 0.8rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase;"></p>
            </div>
        </div>
        <div style="text-align: right;">
            <div id="clock">00:00:00</div>
            <div id="date-display">LOADING...</div>
        </div>
    </header>

    <div class="main-layout">
        <div class="panel">
            <h2 style="font-size: 0.85rem; margin-bottom: 25px; color: var(--text-sub); border-bottom: 3px solid var(--school-green); padding-bottom: 8px; font-weight: 900;">SESSION DETAILS</h2>
            
            <div class="schedule-item">
                <div class="label">Course / Section</div>
                <div class="data" id="out-course">---</div>
            </div>
            
            <div class="schedule-item">
                <div class="label">Assigned Faculty</div>
                <div class="data" id="out-faculty">---</div>
            </div>

            <div class="schedule-item">
                <div class="label">Schedule</div>
                <div class="data" id="out-time">---</div>
            </div>

            <div style="background:#dcfce7; color:#166534; padding:12px; border-radius:10px; font-weight:800; text-align:center; font-size: 0.75rem; margin-bottom: 10px;">
                <i class="fas fa-circle" style="font-size: 0.6rem; vertical-align: middle; margin-right: 5px;"></i> SYSTEM ONLINE
            </div>

            <a href="index.html" class="exit-link">
                <i class="fas fa-power-off"></i> Exit Session
            </a>
        </div>

        <div class="right-content">
            <div class="occupancy-hero">
                <div>
                    <div style="font-size: 0.9rem; opacity: 0.8; font-weight: 800; letter-spacing: 1px;">REAL-TIME OCCUPANCY</div>
                    <div style="font-size: 6rem; font-weight: 900; line-height: 1;">35 <small style="font-size: 2rem; opacity: 0.5;">/ 40</small></div>
                </div>
                <i class="fas fa-users fa-5x" style="opacity: 0.15;"></i>
            </div>

            <div class="sensor-grid">
                <div class="sensor-card">
                    <div class="s-val">24.5°C</div>
                    <div class="s-label">Temperature</div>
                </div>
                <div class="sensor-card">
                    <div class="s-val">58%</div>
                    <div class="s-label">Humidity</div>
                </div>
                <div class="sensor-card">
                    <div class="s-val">92 AQI</div>
                    <div class="s-label">Air Quality</div>
                </div>
                <div class="sensor-card">
                    <div class="s-val">450 Lx</div>
                    <div class="s-label">Light Level</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('display-room').innerText = localStorage.getItem('room') || "ROOM";
        document.getElementById('display-bldg').innerText = localStorage.getItem('building') || "BUILDING";
        document.getElementById('out-faculty').innerText = localStorage.getItem('faculty') || "N/A";
        document.getElementById('out-course').innerText = localStorage.getItem('course') || "N/A";
        document.getElementById('out-time').innerText = localStorage.getItem('time') || "N/A";

        function updateDateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour12: false });
            const options = { weekday: 'long', year: 'numeric', month: 'short', day: '2-digit' };
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-US', options).toUpperCase();
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();
    </script>
</body>
</html>
