<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PHINMA UPang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --school-green: #1b4332; 
            --paper-white: #ffffff; 
            --desk-gray: #f2f4f7; 
            --border-ink: #e2e8f0; 
            --hint-gray: #94a3b8; 
            --accent-green: #2d6a4f;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--desk-gray); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        #login-card {
            background: var(--paper-white); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%; 
            max-width: 420px; 
            text-align: center;
        }

        .logo-img { height: 80px; margin-bottom: 15px; }
        .form-header h2 { font-weight: 800; font-size: 1.4rem; color: var(--school-green); line-height: 1.2; }
        .input-group { margin: 18px 0; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: #64748b; text-transform: uppercase; }

        .input-group input { 
            width: 100%; 
            padding: 12px 16px; 
            border-radius: 10px; 
            border: 2px solid var(--border-ink); 
            outline: none; 
            font-weight: 600; 
            color: var(--school-green); 
            background: white;
            transition: all 0.2s;
        }

        .input-group input:focus {
            border-color: var(--school-green);
            box-shadow: 0 0 0 4px rgba(27, 67, 50, 0.1);
        }

        .btn-login { 
            width: 100%; 
            background: var(--school-green); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
            font-size: 1rem;
        }
        
        .btn-login:hover { background: var(--accent-green); }

        .btn-guest {
            width: 100%;
            background: transparent;
            color: #475569;
            border: 2px solid var(--border-ink);
            padding: 13px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 12px;
            font-size: 0.9rem;
        }

        .btn-guest:hover {
            background: #f8fafc;
            color: var(--school-green);
            border-color: var(--school-green);
        }

        .forgot-link {
            display: inline-block;
            margin-top: 20px;
            font-size: 0.8rem;
            color: var(--hint-gray);
            text-decoration: none;
        }

        .forgot-link:hover { color: var(--school-green); }

        ::placeholder { color: var(--hint-gray); opacity: 0.7; }
    </style>
</head>
<body>
    <div id="login-card">
        <img src="logo.png" alt="PHINMA Logo" class="logo-img">
        
        <div class="form-header">
            <h2>PHINMA</h2>
            <h2>University of Pangasinan</h2>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">Classroom Monitoring System</p>
        </div>
        
        <div style="margin-top: 30px;">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="login-pass" placeholder="••••••••">
            </div>

            <button class="btn-login" onclick="handleLogin()">LOGIN AS ADMIN</button>
            
            <button class="btn-guest" onclick="continueAsGuest()">CONTINUE AS GUEST</button>

            <a href="#" class="forgot-link">Forgot Password?</a>
        </div>
    </div>

    <script>
        function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('login-pass').value;

            if (user && pass) {
                localStorage.setItem('currentUser', user);
                localStorage.setItem('authStatus', 'logged_in');
                window.location.href = 'admin.html';
            } else {
                alert("Please enter a username and password to proceed.");
            }
        }

        function continueAsGuest() {
            localStorage.setItem('currentUser', 'Guest');
            localStorage.setItem('authStatus', 'guest');
            window.location.href = 'classrooms.html';
        }
    </script>
</body>
</html>
