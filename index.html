<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PHINMA UPang</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --school-green: #1b4332; 
            --paper-white: #ffffff; 
            --desk-gray: #f2f4f7; 
            --border-ink: #e2e8f0; 
            --hint-gray: #94a3b8; 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--desk-gray); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        
        #setup-card {
            background: var(--paper-white); 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%; 
            max-width: 480px; 
            text-align: center;
        }

        .logo-img { height: 80px; margin-bottom: 15px; }
        .form-header h2 { font-weight: 800; font-size: 1.4rem; color: var(--school-green); }
        .input-group { margin: 18px 0; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; color: #64748b; text-transform: uppercase; }
        .course-grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }

        /* The input and selected text color */
        .input-group select, .input-group input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 10px; 
            border: 2px solid var(--border-ink); 
            outline: none; 
            font-weight: 600; 
            color: var(--school-green); 
            background: white;
        }

        /* 1. Makes the "Start" and "End" (Placeholders) GRAY */
        select:invalid, select option[value=""] {
            color: var(--hint-gray) !important;
        }

        /* 2. Ensures normal choices stay the standard color */
        select option {
            color: var(--school-green);
        }

        /* 3. Makes options GRAY when they CANNOT be selected (disabled) */
        select option:disabled { 
            color: var(--hint-gray) !important; 
            background-color: #f8fafc; 
        }

        .time-row { display: flex; align-items: center; gap: 10px; }
        .time-row select { flex: 1; cursor: pointer; }
        .separator { font-weight: 900; color: var(--school-green); font-size: 0.7rem; }

        .btn-start { 
            width: 100%; 
            background: var(--school-green); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 10px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.3s; 
            margin-top: 10px;
        }
        
        .btn-start:hover { background: #2d6a4f; }
        ::placeholder { color: var(--hint-gray); opacity: 1; }
    </style>
</head>
<body>
    <div id="setup-card">
        <img src="logo.png" alt="PHINMA Logo" class="logo-img">
        <div class="form-header">
            <h2>PHINMA</h2>
            <h2>University of Pangasinan</h2>
            <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">Smart Classroom Monitoring System</p>
        </div>
        
        <div class="input-group">
            <label>Assigned Faculty</label>
            <input type="text" id="in-faculty" placeholder="e.g. Prof. Bustillo, N.">
        </div>

        <div class="input-group">
            <label>Class Identification</label>
            <div class="course-grid">
                <select id="in-year" required>
                    <option value="" disabled selected>Year</option>
                    <option value="1st">1st</option>
                    <option value="2nd">2nd</option>
                    <option value="3rd">3rd</option>
                    <option value="4th">4th</option>
                </select>
                <input type="text" id="in-course" placeholder="Course (e.g. BSIT)">
                <input type="text" id="in-block" placeholder="Block">
            </div>
        </div>

        <div class="input-group">
            <label>Time Schedule (1-3 Hours)</label>
            <div class="time-row">
                <select id="in-time-start" onchange="syncTimeOptions('start')" required>
                    <option value="" disabled selected>Start</option>
                    <option value="7:30 AM">7:30 AM</option>
                    <option value="8:00 AM">8:00 AM</option>
                    <option value="8:30 AM">8:30 AM</option>
                    <option value="9:00 AM">9:00 AM</option>
                    <option value="9:30 AM">9:30 AM</option>
                    <option value="10:00 AM">10:00 AM</option>
                    <option value="10:30 AM">10:30 AM</option>
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="11:30 AM">11:30 AM</option>
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="12:30 PM">12:30 PM</option>
                    <option value="1:00 PM">1:00 PM</option>
                    <option value="1:30 PM">1:30 PM</option>
                    <option value="2:00 PM">2:00 PM</option>
                    <option value="2:30 PM">2:30 PM</option>
                    <option value="3:00 PM">3:00 PM</option>
                    <option value="3:30 PM">3:30 PM</option>
                    <option value="4:00 PM">4:00 PM</option>
                </select>

                <span class="separator">TO</span>

                <select id="in-time-end" onchange="syncTimeOptions('end')" required>
                    <option value="" disabled selected>End</option>
                    <option value="8:30 AM">8:30 AM</option>
                    <option value="9:00 AM">9:00 AM</option>
                    <option value="9:30 AM">9:30 AM</option>
                    <option value="10:00 AM">10:00 AM</option>
                    <option value="10:30 AM">10:30 AM</option>
                    <option value="11:00 AM">11:00 AM</option>
                    <option value="11:30 AM">11:30 AM</option>
                    <option value="12:00 PM">12:00 PM</option>
                    <option value="12:30 PM">12:30 PM</option>
                    <option value="1:00 PM">1:00 PM</option>
                    <option value="1:30 PM">1:30 PM</option>
                    <option value="2:00 PM">2:00 PM</option>
                    <option value="2:30 PM">2:30 PM</option>
                    <option value="3:00 PM">3:00 PM</option>
                    <option value="3:30 PM">3:30 PM</option>
                    <option value="4:00 PM">4:00 PM</option>
                    <option value="4:30 PM">4:30 PM</option>
                    <option value="5:00 PM">5:00 PM</option>
                    <option value="5:30 PM">5:30 PM</option>
                    <option value="6:00 PM">6:00 PM</option>
                </select>
            </div>
        </div>

        <button class="btn-start" onclick="saveAndContinue()">PROCEED</button>
    </div>

    <script>
        function timeToVal(tStr) {
            if (!tStr) return null;
            const [time, modifier] = tStr.split(' ');
            let [hours, minutes] = time.split(':').map(Number);
            if (modifier === 'PM' && hours !== 12) hours += 12;
            if (modifier === 'AM' && hours === 12) hours = 0;
            return hours + (minutes / 60);
        }

        function syncTimeOptions(triggeredBy) {
            const startSelect = document.getElementById('in-time-start');
            const endSelect = document.getElementById('in-time-end');
            const startVal = timeToVal(startSelect.value);
            const endVal = timeToVal(endSelect.value);

            if (triggeredBy === 'start' && startVal !== null) {
                Array.from(endSelect.options).forEach(opt => {
                    if (opt.value === "") return;
                    const val = timeToVal(opt.value);
                    opt.disabled = (val < startVal + 1) || (val > startVal + 3);
                });
            }
            if (triggeredBy === 'end' && endVal !== null) {
                Array.from(startSelect.options).forEach(opt => {
                    if (opt.value === "") return;
                    const val = timeToVal(opt.value);
                    opt.disabled = (val > endVal - 1) || (val < endVal - 3);
                });
            }
        }

        function saveAndContinue() {
            const faculty = document.getElementById('in-faculty').value;
            const year = document.getElementById('in-year').value;
            const course = document.getElementById('in-course').value;
            const block = document.getElementById('in-block').value;
            const start = document.getElementById('in-time-start').value;
            const end = document.getElementById('in-time-end').value;

            if(!faculty || !year || !course || !block || !start || !end) { 
                alert("Please fill in all details."); 
                return; 
            }

            localStorage.setItem('faculty', faculty);
            localStorage.setItem('course', `${year} Year ${course} - ${block}`);
            localStorage.setItem('time', `${start} - ${end}`);
            window.location.href = 'hub.html';
        }
    </script>
</body>
</html>
